# Publishes the image to GHCR for continuous deployment (receiver: github.com/higerotech/despliegue-continuo).
#
# The NAME of this workflow is a contract: the receiver only deploys when a workflow_run called exactly
# `build` finishes successfully on `main`. Renaming it stops deployments silently.
#
# `type=sha` produces `sha-<7 hex>`, the tag the receiver expects. Changing that format would make every
# deployment fail with `manifest unknown`.
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # The client of the key service is tested against a real one, in development mode: it starts unsealed and
    # with a known root token, which the tests use to set it up like the one in production.
    services:
      openbao:
        image: openbao/openbao:2.7.1@sha256:6d2b93856e3fcf7b18ad855a0b51eaba474dc8b79cf554379ea32034797d2acf
        env:
          BAO_DEV_ROOT_TOKEN_ID: dev-root
          BAO_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
        ports:
          - 8200:8200
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      # From the lock and with hashes: the tests run against exactly what was pinned.
      - run: pip install --require-hashes -r requirements-dev.lock

      # Branch coverage below what Gate 2 asks for breaks the build.
      - run: pytest --cov=src --cov-branch --cov-fail-under=80
        env:
          OPENBAO_TEST_ADDR: http://127.0.0.1:8200
          OPENBAO_TEST_TOKEN: dev-root
          # Here the integration tests must run: without this they would be skipped without a word.
          OPENBAO_TEST_REQUIRED: "1"

  build:
    # Nothing is published, and so nothing is deployed, unless the tests pass.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

# The deployment is NOT triggered from here. When this workflow completes, GitHub sends workflow_run to the
# server's webhook, which checks the signature, the branch and the conclusion, and deploys the sha-xxxxxxx tag.
