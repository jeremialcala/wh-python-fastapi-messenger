# Publishes the image to GHCR for continuous deployment (receiver: github.com/higerotech/despliegue-continuo).
#
# The NAME of this workflow is a contract: the receiver only deploys when a workflow_run called exactly
# `build` finishes successfully on `main`. Renaming it stops deployments silently.
#
# `type=sha` produces `sha-<7 hex>`, the tag the receiver expects. Changing that format would make every
# deployment fail with `manifest unknown`.
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: pytest test

  build:
    # Nothing is published, and so nothing is deployed, unless the tests pass.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

# The deployment is NOT triggered from here. When this workflow completes, GitHub sends workflow_run to the
# server's webhook, which checks the signature, the branch and the conclusion, and deploys the sha-xxxxxxx tag.
