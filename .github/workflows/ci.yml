# Tests and a throwaway image build for every pull request.
#
# Kept apart from `build` on purpose: the receiver deploys on any successful workflow_run named `build`,
# so that workflow must only ever run for pushes to main.
name: ci

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # The client of the key service is tested against a real one, in development mode: it starts unsealed and
    # with a known root token, which the tests use to set it up like the one in production.
    services:
      openbao:
        image: openbao/openbao:2.7.1@sha256:6d2b93856e3fcf7b18ad855a0b51eaba474dc8b79cf554379ea32034797d2acf
        env:
          BAO_DEV_ROOT_TOKEN_ID: dev-root
          BAO_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
        ports:
          - 8200:8200
      # Publishing is tested against a real broker, the same version as the one in production.
      rabbitmq:
        image: rabbitmq:4.3.5-management@sha256:57bddb6fbc3498b5d8b5a14dc6f4506073ebcf94c66ba2a7678c335faa8dd631
        env:
          RABBITMQ_DEFAULT_USER: test
          RABBITMQ_DEFAULT_PASS: test
        ports:
          - 5672:5672
        # The job waits for this one: it takes a few seconds to accept connections.
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7

      # The event bus, the same version as Bifröst and set up like it. Not a service container: those take no
      # arguments, and NATS needs its configuration file, which only exists once the repository is checked out.
      - name: NATS JetStream
        run: |
          docker run -d --name nats -p 4222:4222 -p 8222:8222 \
            -v "$PWD/tests/integration/nats-test.conf:/etc/nats/test.conf:ro" \
            nats:2.14.8-alpine@sha256:f9512b17aae6d41b6a615a7afad7b328633639ddae025744623e69b26fe686be \
            -c /etc/nats/test.conf
          for _ in $(seq 1 30); do
            curl -fs "http://127.0.0.1:8222/healthz?js-enabled-only=true" && exit 0
            sleep 1
          done
          docker logs nats
          exit 1

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      # From the lock and with hashes: the tests run against exactly what was pinned.
      - run: pip install --require-hashes -r requirements-dev.lock

      # Branch coverage below what Gate 2 asks for breaks the build.
      - run: pytest --cov=src --cov-branch --cov-fail-under=80
        env:
          OPENBAO_TEST_ADDR: http://127.0.0.1:8200
          OPENBAO_TEST_TOKEN: dev-root
          # Here the integration tests must run: without this they would be skipped without a word.
          OPENBAO_TEST_REQUIRED: "1"
          RABBITMQ_TEST_ADDR: 127.0.0.1:5672
          RABBITMQ_TEST_REQUIRED: "1"
          NATS_TEST_ADDR: 127.0.0.1:4222
          NATS_TEST_MONITOR: 127.0.0.1:8222
          NATS_TEST_REQUIRED: "1"

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
