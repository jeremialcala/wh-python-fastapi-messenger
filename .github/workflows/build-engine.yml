# Publishes the image of the response engine to GHCR: ghcr.io/<owner>/hive-engine (ADR-0023; named after the product
# since ADR-0024, version 0.3.0).
#
# The NAME is not `build` on purpose. The receiver deploys the gateway when a workflow_run called exactly `build`
# finishes on main; one more `build` would redeploy the gateway on every change of the engine. The receiver tells
# the apps of one repository apart by the name of their workflow (ADR-0010 of despliegue-continuo): the engine is
# deployed by declaring an app that names `build-engine`. It is not deployed anywhere yet.
#
# `type=sha` produces `sha-<7 hex>`, the tag the receiver expects.
name: build-engine

on:
  push:
    branches: [main]
    paths:
      - "engine/**"
      - "shared/**"
      - ".github/workflows/build-engine.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v7

      # The same bus as in `engine`, so the integration tests run here too instead of being skipped.
      - name: NATS JetStream
        run: |
          docker run -d --name nats -p 4222:4222 -p 8222:8222 \
            -v "$PWD/tests/integration/nats-test.conf:/etc/nats/test.conf:ro" \
            nats:2.14.8-alpine@sha256:f9512b17aae6d41b6a615a7afad7b328633639ddae025744623e69b26fe686be \
            -c /etc/nats/test.conf
          for _ in $(seq 1 30); do
            curl -fs "http://127.0.0.1:8222/healthz?js-enabled-only=true" && exit 0
            sleep 1
          done
          docker logs nats
          exit 1

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements-dev.lock

      - run: pip install --require-hashes -r requirements-dev.lock

      - run: pylint --rcfile=pyproject.toml src

      - run: python -m pytest --cov=src --cov-branch --cov-fail-under=80
        env:
          NATS_TEST_ADDR: 127.0.0.1:4222
          NATS_TEST_REQUIRED: "1"

  build:
    # Nothing is published unless the tests pass.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/hive-engine
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v7
        with:
          # From the root, where shared/ is (ADR-0023); engine/Dockerfile.dockerignore says what goes in.
          context: .
          file: engine/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=engine
          cache-to: type=gha,mode=max,scope=engine
