[tox]
envlist = pylint,py312,coverage,pycobertura
skipsdist = True

[tox:hudson]
downloadcache = {toxworkdir}/_download

[testenv:pylint]
deps = pylint
       -rrequirements.txt
# pylint se configura en pyproject.toml ([tool.pylint]).
commands = pylint --rcfile=pyproject.toml src main.py

[testenv:py312]
deps = pytest
       coverage
       pytest-cov
       -r requirements.txt

commands = py.test --cov=src test/ \
                   --cov-config tox.ini \
                   --cov-report 'xml' \
                   -p no:warnings

ignore=test/*.py

[testenv:coverage]
deps = coverage

commands = coverage report --rcfile=tox.ini --fail-under=60
           coverage xml

[report]
show_missing = True
