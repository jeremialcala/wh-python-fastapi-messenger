# Hive's response engine as it runs on midgard (E7 of engine/docs/00-project/plan-de-los-workers.md). Copy to
# /srv/apps/hive-engine/, next to its .env and its keys/ directory.
#
# The four workers of the skeleton, one container each, all from the same image (ADR-0008): each one says which it
# is with its command. They pass each message along through Bifröst, and none serves a port.
#
#   * the image tag is never `latest`: ENGINE_IMAGE_TAG says which build runs, so a rollback is bringing the previous
#     tag back up
#   * Bifröst: each worker reads its own file of credentials, as Bifröst wrote it (its user, password and prefix of
#     reply subjects), and Bifröst's CA, both read-only, over the external `bifrost` network
#   * Andvari: each worker logs in with its own AppRole, `motor-<worker>`. The role ids are not secret and come from
#     .env; each secret id is a file in keys/, readable only by uid 10001, the image's user. With its role it reads
#     its key for each client and, if it calls Claude, its key of the Anthropic API (ADR-0009)
#   * the gateway's management API is reached over the external `andvari` network, as host `bots-gateway`. The
#     coordinator and the notifier sign their calls with the gateway's public key, keys/gateway-public.json, and the
#     audience of .env, GATEWAY_AUDIENCE (ADR-0024)
#   * traces go to Saga, Yggdrasil's Grafana Tempo, over the external `yggdrasil_saga` network
#   * each worker is alive while it keeps asking Bifröst for messages: it touches /tmp/<worker>-alive at least every
#     5 seconds, and the health check looks at how old that file is
#
#   ENGINE_IMAGE_TAG=<tag> docker compose --project-directory /srv/apps/hive-engine up -d

name: hive-engine

x-worker: &worker
  image: ghcr.io/jeremialcala/chatbot-engine:${ENGINE_IMAGE_TAG:?ENGINE_IMAGE_TAG is required}
  restart: unless-stopped
  networks: [bifrost, andvari, saga]
  read_only: true
  # The worker writes nothing but its mark of life and what Python needs in /tmp.
  tmpfs: [/tmp]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  mem_limit: 192m
  cpus: 0.5
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

x-andvari: &andvari
  ANDVARI_ADDR: https://andvari:8200
  ANDVARI_CA_FILE: /run/andvari/ca.crt
  ENGINE_SECRET_ID_FILE: /run/andvari/secret-id
  OTEL_EXPORTER_OTLP_ENDPOINT: http://saga:4318
  LOG_LEVEL: INFO

x-gateway: &gateway
  GATEWAY_URL: http://bots-gateway:5002
  GATEWAY_AUDIENCE: ${GATEWAY_AUDIENCE:?GATEWAY_AUDIENCE is required}
  GATEWAY_PUBLIC_KEYS_FILE: /run/gateway/gateway-public.json

services:
  classifier:
    <<: *worker
    container_name: hive-classifier
    command: ["python", "-m", "src.workers.classifier"]
    env_file: [/srv/infra/bifrost/credenciales/classifier.env]
    environment:
      <<: *andvari
      OTEL_SERVICE_NAME: engine-classifier
      ENGINE_ROLE_ID: ${CLASSIFIER_ROLE_ID:?CLASSIFIER_ROLE_ID is required}
    volumes:
      - ./keys/classifier-secret-id:/run/andvari/secret-id:ro
      - /srv/infra/andvari/tls/ca.crt:/run/andvari/ca.crt:ro
      - /srv/infra/bifrost/tls/ca.crt:/run/bifrost/ca.crt:ro
    healthcheck: &alive
      test: ["CMD", "python", "-c",
             "import os, sys, time; sys.exit(time.time() - os.path.getmtime('/tmp/classifier-alive') > 60)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  coordinator:
    <<: *worker
    container_name: hive-coordinator
    command: ["python", "-m", "src.workers.coordinator"]
    env_file: [/srv/infra/bifrost/credenciales/coordinator.env]
    environment:
      <<: [*andvari, *gateway]
      OTEL_SERVICE_NAME: engine-coordinator
      ENGINE_ROLE_ID: ${COORDINATOR_ROLE_ID:?COORDINATOR_ROLE_ID is required}
    volumes:
      - ./keys/coordinator-secret-id:/run/andvari/secret-id:ro
      - ./keys/gateway-public.json:/run/gateway/gateway-public.json:ro
      - /srv/infra/andvari/tls/ca.crt:/run/andvari/ca.crt:ro
      - /srv/infra/bifrost/tls/ca.crt:/run/bifrost/ca.crt:ro
    healthcheck:
      <<: *alive
      test: ["CMD", "python", "-c",
             "import os, sys, time; sys.exit(time.time() - os.path.getmtime('/tmp/coordinator-alive') > 60)"]

  responder:
    <<: *worker
    container_name: hive-responder
    command: ["python", "-m", "src.workers.responder"]
    env_file: [/srv/infra/bifrost/credenciales/responder.env]
    environment:
      <<: *andvari
      OTEL_SERVICE_NAME: engine-responder
      ENGINE_ROLE_ID: ${RESPONDER_ROLE_ID:?RESPONDER_ROLE_ID is required}
    volumes:
      - ./keys/responder-secret-id:/run/andvari/secret-id:ro
      - /srv/infra/andvari/tls/ca.crt:/run/andvari/ca.crt:ro
      - /srv/infra/bifrost/tls/ca.crt:/run/bifrost/ca.crt:ro
    healthcheck:
      <<: *alive
      test: ["CMD", "python", "-c",
             "import os, sys, time; sys.exit(time.time() - os.path.getmtime('/tmp/responder-alive') > 60)"]

  notifier:
    <<: *worker
    container_name: hive-notifier
    command: ["python", "-m", "src.workers.notifier"]
    env_file: [/srv/infra/bifrost/credenciales/notifier.env]
    environment:
      <<: [*andvari, *gateway]
      OTEL_SERVICE_NAME: engine-notifier
      ENGINE_ROLE_ID: ${NOTIFIER_ROLE_ID:?NOTIFIER_ROLE_ID is required}
    volumes:
      - ./keys/notifier-secret-id:/run/andvari/secret-id:ro
      - ./keys/gateway-public.json:/run/gateway/gateway-public.json:ro
      - /srv/infra/andvari/tls/ca.crt:/run/andvari/ca.crt:ro
      - /srv/infra/bifrost/tls/ca.crt:/run/bifrost/ca.crt:ro
    healthcheck:
      <<: *alive
      test: ["CMD", "python", "-c",
             "import os, sys, time; sys.exit(time.time() - os.path.getmtime('/tmp/notifier-alive') > 60)"]

networks:
  bifrost:
    external: true
  andvari:
    external: true
  saga:
    name: yggdrasil_saga
    external: true
