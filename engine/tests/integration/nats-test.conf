# Un NATS JetStream para las pruebas de integración del motor, como Bifröst (repositorio bifrost, nats/bifrost.conf):
# fsync antes de cada acuse, el mismo tamaño máximo de mensaje y cada worker con sus sujetos y su prefijo de buzón,
# nada más. Sin TLS ni almacén cifrado: son del servidor, no del cliente.
#
#   docker run --rm -p 127.0.0.1:24222:4222 -v "$PWD/tests/integration/nats-test.conf:/etc/nats/test.conf:ro" \
#       nats:2.14.8-alpine -c /etc/nats/test.conf

listen: 0.0.0.0:4222
http: 0.0.0.0:8222
max_payload: 4MB

jetstream {
  store_dir: "/tmp/jetstream"
  sync_interval: always
}

authorization {
  users: [
    # Las pruebas preparan los streams y miran lo que hay con este.
    { user: admin, password: test }
    # Lo que Bifröst da al clasificador.
    { user: classifier, password: test, permissions: {
        publish: { allow: [
          "motor.clasificado.>",
          "$JS.API.INFO",
          "$JS.API.CONSUMER.INFO.MENSAJES.classifier",
          "$JS.API.CONSUMER.MSG.NEXT.MENSAJES.classifier",
          "$JS.ACK.MENSAJES.classifier.>"
        ] }
        subscribe: { allow: ["_INBOX_classifier.>"] }
    } }
  ]
}
