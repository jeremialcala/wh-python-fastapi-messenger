# Un NATS JetStream para las pruebas de integración del motor, como Bifröst (repositorio bifrost, nats/bifrost.conf):
# fsync antes de cada acuse, el mismo tamaño máximo de mensaje y cada worker con sus sujetos y su prefijo de buzón,
# nada más. Sin TLS ni almacén cifrado: son del servidor, no del cliente.
#
#   docker run --rm -p 127.0.0.1:24222:4222 -v "$PWD/tests/integration/nats-test.conf:/etc/nats/test.conf:ro" \
#       nats:2.14.8-alpine -c /etc/nats/test.conf

listen: 0.0.0.0:4222
http: 0.0.0.0:8222
max_payload: 4MB

jetstream {
  store_dir: "/tmp/jetstream"
  sync_interval: always
}

authorization {
  users: [
    # Las pruebas preparan los streams y miran lo que hay con este.
    { user: admin, password: test }
    # Lo que Bifröst da al clasificador.
    { user: classifier, password: test, permissions: {
        publish: { allow: [
          "motor.clasificado.>",
          "$JS.API.INFO",
          "$JS.API.CONSUMER.INFO.MENSAJES.classifier",
          "$JS.API.CONSUMER.MSG.NEXT.MENSAJES.classifier",
          "$JS.ACK.MENSAJES.classifier.>"
        ] }
        subscribe: { allow: ["_INBOX_classifier.>"] }
    } }
    # Lo que Bifröst da al coordinador.
    { user: coordinator, password: test, permissions: {
        publish: { allow: [
          "motor.pedido.>",
          "$JS.API.INFO",
          "$JS.API.CONSUMER.INFO.MOTOR.coordinator",
          "$JS.API.CONSUMER.MSG.NEXT.MOTOR.coordinator",
          "$JS.ACK.MOTOR.coordinator.>"
        ] }
        subscribe: { allow: ["_INBOX_coordinator.>"] }
    } }
    # Lo que Bifröst da al de respuesta.
    { user: responder, password: test, permissions: {
        publish: { allow: [
          "motor.respuesta.>",
          "$JS.API.INFO",
          "$JS.API.CONSUMER.INFO.MOTOR.responder",
          "$JS.API.CONSUMER.MSG.NEXT.MOTOR.responder",
          "$JS.ACK.MOTOR.responder.>"
        ] }
        subscribe: { allow: ["_INBOX_responder.>"] }
    } }
    # Lo que Bifröst da al notificador: su consumidor, lo enviado para el historial y el bucket `enviados`, nada más.
    { user: notifier, password: test, permissions: {
        publish: { allow: [
          "engine.reply.sent.>",
          "$JS.API.INFO",
          "$JS.API.CONSUMER.INFO.MOTOR.notifier",
          "$JS.API.CONSUMER.MSG.NEXT.MOTOR.notifier",
          "$JS.ACK.MOTOR.notifier.>",
          "$JS.API.STREAM.INFO.KV_enviados",
          "$JS.API.DIRECT.GET.KV_enviados.>",
          "$JS.API.STREAM.MSG.GET.KV_enviados",
          "$KV.enviados.>"
        ] }
        subscribe: { allow: ["_INBOX_notifier.>"] }
    } }
  ]
}
