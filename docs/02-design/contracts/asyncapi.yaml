# Contrato AsyncAPI del gateway (fase 02-design, Gate 1).
# Estado: approved (Gate 1, 2026-10-12). Versión: 1.0.0.
#
# Describe el sobre versión 1 que el gateway publica en la cola `llm`, decidido en ADR-0011.
# tests/contract/test_queue_contract.py genera ese mensaje con el código real y lo valida contra el esquema
# SobreMensaje: si el código cambia el mensaje, la prueba falla y hay que actualizar este fichero.
#
# Lo que el motor de respuestas tiene que hacer con él (aceptarlo para Messenger, conservar el bot y deduplicar)
# está en ADR-0011 y es trabajo de su repositorio.
asyncapi: 3.0.0
info:
  title: Gateway BaaS de mensajería
  version: 1.1.0
  description: >-
    Mensajes que el gateway publica para el motor de respuestas (ms-python-metamsghandler). Un sobre por cada
    mensaje que una persona envía al bot: firma de la notificación verificada, contacto identificado y bot de
    destino conocido. Una notificación de Meta puede traer varios mensajes y produce un sobre por cada uno. Los
    acuses de entrega y de lectura, los ecos de lo que envía la propia página y las pulsaciones de botones de
    Messenger no se publican.
defaultContentType: application/json
servers:
  hermod:
    host: 'hermod:5672'
    protocol: amqp
    protocolVersion: 0.9.1
    description: >-
      RabbitMQ de la plataforma, alcanzable solo desde la red Docker `hermod`. Sin TLS dentro de esa red.
    security:
      - $ref: '#/components/securitySchemes/usuarioBroker'
channels:
  llm:
    address: llm
    description: >-
      Cola durable, declarada sin argumentos por los dos lados. El gateway publica en el exchange por defecto con
      la clave de enrutado `llm`, con mensajes persistentes y confirmación del broker. El contenido viaja sin
      cifrar.
    messages:
      sobreMensaje:
        $ref: '#/components/messages/SobreMensaje'
    bindings:
      amqp:
        is: queue
        queue:
          name: llm
          durable: true
          exclusive: false
          autoDelete: false
        bindingVersion: 0.3.0
operations:
  publicarMensaje:
    action: send
    channel:
      $ref: '#/channels/llm'
    summary: Publica un mensaje entrante ya verificado.
    description: >-
      El gateway responde 200 a Meta solo cuando el broker confirma todos los mensajes de la notificación, y 503
      si no puede publicar alguno. Meta reintenta ante un 503 con la notificación entera, así que el consumidor
      puede recibir el mismo mensaje más de una vez: se reconoce porque repite `messageId` para el mismo
      `botId`. El gateway no deduplica. Cada mensaje caduca a las 24 horas de publicarse: el broker lo descarta
      si nadie lo ha consumido.
    messages:
      - $ref: '#/channels/llm/messages/sobreMensaje'
    bindings:
      amqp:
        deliveryMode: 2
        mandatory: true
        expiration: 86400000
        bindingVersion: 0.3.0
components:
  securitySchemes:
    usuarioBroker:
      type: userPassword
      description: Usuario y contraseña del broker (QMS_USER, QMS_PASSWORD), propios del gateway.
  messages:
    SobreMensaje:
      name: SobreMensaje
      title: Mensaje entrante de WhatsApp o de Messenger
      contentType: application/json
      payload:
        $ref: '#/components/schemas/SobreMensaje'
  schemas:
    SobreMensaje:
      type: object
      description: >-
        Sobre del gateway, versión 1. Es el único formato que lleva el bot de destino, porque el webhook de Meta
        no lo incluye: el `bot_id` solo existe en la URL del webhook.
      required: [schemaVersion, _uuid, messageId, jwe_body, createdAt, status, statusDate]
      additionalProperties: false
      properties:
        schemaVersion:
          const: 1
          description: >-
            Versión del sobre. Un cambio que el consumidor no pueda ignorar la sube; el consumidor rechaza las
            que no conoce.
        _uuid:
          $ref: '#/components/schemas/UuidExtendido'
          description: >-
            Identificador del sobre, distinto en cada publicación. Si Meta entrega dos veces el mismo mensaje,
            cada entrega lleva un `_uuid` distinto: no sirve para deduplicar.
        messageId:
          type: string
          minLength: 1
          description: >-
            Identificador que Meta dio al mensaje: `id` (wamid) en WhatsApp y `mid` en Messenger. Es el mismo
            en cada reentrega. Junto con `jwe_body.botId` es la clave de deduplicación del consumidor.
        createdAt:
          $ref: '#/components/schemas/FechaExtendida'
          description: Momento en que el gateway creó el sobre.
        statusDate:
          $ref: '#/components/schemas/FechaExtendida'
          description: Igual que createdAt.
        status:
          type: integer
          description: Siempre 0 (registrado). No aporta información.
        jwe_body:
          $ref: '#/components/schemas/Cuerpo'
    Cuerpo:
      type: object
      description: >-
        Pese a su nombre, viaja como objeto JSON sin cifrar. Pasará a ser un JWE cifrado para el motor en la
        segunda fase de ADR-0011, con otra versión del sobre.
      required: [botId, clientId, type, contact, message]
      additionalProperties: false
      properties:
        botId:
          type: string
          format: uuid
          description: Bot al que iba dirigido el mensaje. Es la llave con la que el motor pide la configuración (ADR-0003).
        clientId:
          type: string
          format: uuid
          description: >-
            Cliente dueño del bot. Le dice al motor con cuál de sus credenciales pedir la configuración: tiene
            una por cliente (ADR-0016).
        type:
          type: string
          enum: [whatsapp_business_account, page]
          description: Canal, con el valor del campo `object` del webhook de Meta.
        contact:
          $ref: '#/components/schemas/Contacto'
        message:
          description: Contenido del canal. Su forma depende de `type`.
          oneOf:
            - $ref: '#/components/schemas/MensajeWhatsApp'
            - $ref: '#/components/schemas/EventoMessenger'
    Contacto:
      type: object
      description: Quién escribe. Lleva `waId` en WhatsApp y `fbId` en Messenger. Dato personal, en claro.
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: [string, 'null']
          description: Nombre del contacto.
        waId:
          type: string
          description: Número de teléfono de WhatsApp del contacto.
        fbId:
          type: string
          description: Identificador del contacto en Messenger (PSID).
    MensajeWhatsApp:
      type: object
      description: >-
        El objeto `value` del cambio de WhatsApp Cloud API, reducido a un solo mensaje y a quien lo envía.
      required: [messaging_product, metadata, contacts, messages]
      additionalProperties: false
      properties:
        messaging_product:
          type: string
        metadata:
          type: object
          description: Número del bot que recibió el mensaje, tal como lo envía Meta.
          required: [phone_number_id]
          properties:
            display_phone_number:
              type: string
              description: Número del bot, como se muestra.
            phone_number_id:
              type: string
              minLength: 1
              description: Identificador del número en Meta. Es desde donde el motor envía la respuesta.
        contacts:
          type: array
          description: El contacto que envió el mensaje, tal como lo envía Meta. Vacío si Meta no lo incluyó.
          maxItems: 1
          items:
            type: object
        messages:
          type: array
          description: El mensaje tal como lo envía Meta. Su `id` es el `messageId` del sobre.
          minItems: 1
          maxItems: 1
          items:
            type: object
            required: [id, from]
    EventoMessenger:
      type: object
      description: >-
        Un elemento de `entry[].messaging[]` de la Messenger Platform, tal como lo envía Meta. Solo mensajes de
        una persona: nunca un eco.
      required: [sender, message]
      properties:
        sender:
          type: object
          required: [id]
        recipient:
          type: object
        timestamp:
          type: integer
        message:
          type: object
          description: Su `mid` es el `messageId` del sobre.
          required: [mid]
    UuidExtendido:
      type: object
      description: UUID en el JSON extendido de MongoDB.
      required: [$uuid]
      additionalProperties: false
      properties:
        $uuid:
          type: string
          pattern: '^[0-9a-f]{32}$'
    FechaExtendida:
      type: object
      description: Fecha en el JSON extendido de MongoDB, en milisegundos desde 1970.
      required: [$date]
      additionalProperties: false
      properties:
        $date:
          type: integer
