# Contrato OpenAPI de un servicio del gateway (fase 02-design). Refleja la API tal como está construida.
# Generado con .ai-dlc/scripts/gen_openapi.py: regenerar, no editar a mano.
# Sin valores por defecto ni ejemplos: en el código son aleatorios y cambian en cada arranque.
# Declara el token de autenticación (HTTPBearer: un JWT firmado dentro de un JWE). La firma X-Hub-Signature-256
# del webhook no aparece: se comprueba en una dependencia que OpenAPI no ve.
components:
  schemas:
    ActionParameterRequest:
      properties:
        description:
          title: Description
          type: string
        enum:
          items: {}
          title: Enum
          type: array
        name:
          title: Name
          type: string
        required:
          title: Required
          type: boolean
        type:
          title: Type
          type: string
      required:
      - name
      title: ActionParameterRequest
      type: object
    ActionRequest:
      properties:
        apiCall:
          $ref: '#/components/schemas/ApiCallRequest'
        description:
          title: Description
          type: string
        name:
          title: Name
          type: string
        parameters:
          items:
            $ref: '#/components/schemas/ActionParameterRequest'
          title: Parameters
          type: array
        type:
          title: Type
          type: string
      required:
      - name
      - description
      title: ActionRequest
      type: object
    ApiCallRequest:
      properties:
        authRef:
          title: Authref
          type: string
        authType:
          title: Authtype
          type: string
        body:
          additionalProperties: true
          title: Body
          type: object
        headers:
          additionalProperties: true
          title: Headers
          type: object
        method:
          title: Method
          type: string
        query:
          additionalProperties: true
          title: Query
          type: object
        timeout:
          title: Timeout
          type: integer
        url:
          title: Url
          type: string
      required:
      - url
      title: ApiCallRequest
      type: object
    BotCredentialsRequest:
      additionalProperties: false
      description: 'The Meta credentials of a chatbot. Each one that is sent replaces the stored one; the ones left
        out stay

        as they are. They are stored encrypted and no endpoint returns them.'
      properties:
        appSecret:
          anyOf:
          - maxLength: 256
            minLength: 1
            type: string
          - type: 'null'
          title: Appsecret
        facebookToken:
          anyOf:
          - maxLength: 2048
            minLength: 1
            type: string
          - type: 'null'
          title: Facebooktoken
        whatsappToken:
          anyOf:
          - maxLength: 2048
            minLength: 1
            type: string
          - type: 'null'
          title: Whatsapptoken
      title: BotCredentialsRequest
      type: object
    BotResponse:
      properties:
        code:
          title: Code
          type: integer
        data:
          anyOf:
          - additionalProperties: true
            type: object
          - items: {}
            type: array
          - {}
          - type: 'null'
          title: Data
        message:
          title: Message
          type: string
        timestamp:
          format: date-time
          title: Timestamp
          type: string
      title: BotResponse
      type: object
    ChatbotPhoneRequest:
      properties:
        environment:
          anyOf:
          - type: string
          - type: 'null'
          title: Environment
        phoneId:
          title: Phoneid
          type: string
        phoneNumber:
          title: Phonenumber
          type: string
      title: ChatbotPhoneRequest
      type: object
    ChatbotRequest:
      properties:
        description:
          title: Description
          type: string
        name:
          title: Name
          type: string
        role:
          title: Role
          type: string
        tone:
          title: Tone
          type: string
      title: ChatbotRequest
      type: object
    ClientRequest:
      additionalProperties: false
      properties:
        name:
          maxLength: 64
          minLength: 3
          pattern: ^[A-Za-z0-9][A-Za-z0-9 ._-]*$
          title: Name
          type: string
        signingKey:
          additionalProperties: true
          title: Signingkey
          type: object
      required:
      - signingKey
      - name
      title: ClientRequest
      type: object
    ContactSearchRequest:
      additionalProperties: false
      description: 'Who to look for among the contacts of a client: a WhatsApp number or a Messenger id, one of
        the two.

        It travels in the body, not in the address: an address ends up in logs along the way.'
      properties:
        fbId:
          anyOf:
          - maxLength: 64
            minLength: 1
            type: string
          - type: 'null'
          title: Fbid
        waId:
          anyOf:
          - maxLength: 32
            minLength: 1
            pattern: ^[0-9+() .-]*[0-9][0-9+() .-]*$
            type: string
          - type: 'null'
          title: Waid
      title: ContactSearchRequest
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    IntentRequest:
      properties:
        actions:
          items:
            $ref: '#/components/schemas/ActionRequest'
          title: Actions
          type: array
        description:
          title: Description
          type: string
        name:
          title: Name
          type: string
        samplePhrases:
          items: {}
          title: Samplephrases
          type: array
      required:
      - name
      - description
      title: IntentRequest
      type: object
    OwnedKeyRequest:
      additionalProperties: false
      properties:
        proof:
          maxLength: 8192
          minLength: 1
          title: Proof
          type: string
        signingKey:
          additionalProperties: true
          title: Signingkey
          type: object
      required:
      - signingKey
      - proof
      title: OwnedKeyRequest
      type: object
    ResponseData:
      properties:
        code:
          title: Code
          type: integer
        data:
          anyOf:
          - additionalProperties: true
            type: object
          - items: {}
            type: array
          - {}
          - type: 'null'
          title: Data
        message:
          title: Message
          type: string
        timestamp:
          format: date-time
          title: Timestamp
          type: string
      title: ResponseData
      type: object
    RulesRequest:
      properties:
        rules:
          items: {}
          title: Rules
          type: array
      title: RulesRequest
      type: object
    SigningKeyRequest:
      additionalProperties: false
      properties:
        signingKey:
          additionalProperties: true
          title: Signingkey
          type: object
      required:
      - signingKey
      title: SigningKeyRequest
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
  securitySchemes:
    HTTPBearer:
      bearerFormat: JWE
      description: A JWT signed by the client (ES256), inside a JWE encrypted to the gateway (RSA-OAEP-256, A256CBC-HS512).
        It lasts 60 seconds at most and is valid once.
      scheme: bearer
      type: http
info:
  contact:
    email: jeremialcala@gmail.com
    name: Jeremi Alcala
    url: https://jeremi.web-ones.com/
  description: "\nThe management API of the gateway between Meta (Messenger and WhatsApp) and the response engine\
    \ of each chatbot.\nEach client manages its own chatbots through it and reaches nothing of anybody else's. What\
    \ Meta calls is another\nservice, the webhook, which runs apart from this one.\n\nEvery route but the health\
    \ check asks for a token in `Authorization: Bearer`: a JWT signed by the caller inside a\nJWE encrypted to the\
    \ gateway, valid once and for 60 seconds at most.\n\n### A client and its chatbots\n\n* /bot: @POST creates\
    \ a chatbot.\n* /bot/{bot_id}: @DELETE deletes it with everything stored for it.\n* /chat/{bot_id}/info: @GET\
    \ what is stored of the chatbot, and which Meta credentials are loaded.\n* /chat/{bot_id}/credentials: @PUT\
    \ loads or rotates its Meta credentials. They are never returned.\n* /chat/{bot_id}/phones: @POST adds a WhatsApp\
    \ number, @GET lists them. `?environment=` gives the last one of it.\n* /chat/{bot_id}/rules: @POST adds rules,\
    \ @GET builds the system prompt from them.\n* /chat/{bot_id}/intents: @POST and @GET; /chat/{bot_id}/intents/{intent_id}\
    \ takes @GET, @PUT and @DELETE.\n* /chat/{bot_id}/tools: @GET the actions of its intents as tool definitions\
    \ for the model.\n* /chat/{bot_id}/contacts: @GET who wrote to it, a page at a time; /chat/{bot_id}/contacts/{contact_id}\
    \ exports\n  one with @GET and deletes it with @DELETE.\n* /contacts/search: @POST finds a person in every chatbot\
    \ of the client, by number or by Messenger id.\n* /keys: @GET the keys of the caller, @POST adds one to rotate;\
    \ /keys/{kid} removes one with @DELETE.\n\n### The response engine\n\n* /chat/{bot_id}/tokens: @GET the Meta\
    \ tokens of a chatbot. Only for the engine, with the key it holds for the\n  client that owns the chatbot. It\
    \ also reads the rules and the tools of that chatbot, and nothing else.\n\n### The operator\n\n* /clients: @POST\
    \ registers a client, @GET lists them; /clients/{client_id} takes one off with @DELETE.\n* /clients/{client_id}/keys:\
    \ the keys a client signs with; /clients/{client_id}/service-keys, the keys the\n  response engine signs with\
    \ for that client.\n\n### Any caller\n\n* /gateway/keys: @GET the audience and the public keys tokens are encrypted\
    \ to.\n* /health: @GET liveness, without a token.\n"
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  summary: Controls the Facebook Messenger Lifecycle
  termsOfService: https://web-ones.com/terms
  title: Facebook Messenger Webhook Manager
  version: 0.0.0
openapi: 3.1.0
paths:
  /bot:
    post:
      operationId: create_chatbot_bot_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatbotRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Create Chatbot
      tags:
      - Bot
  /bot/{bot_id}:
    delete:
      description: 'Deletes a chatbot and everything stored for it: its contacts, phones, rules and intents. It
        cannot be

        undone. From then on its webhook answers 404: the subscription in Meta has to be removed as well.'
      operationId: delete_chatbot_bot__bot_id__delete
      parameters:
      - in: path
        name: bot_id
        required: true
        schema:
          title: Bot Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseData'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Delete Chatbot
      tags:
      - Bot
  /chat/{bot_id}/contacts:
    get:
      description: The contacts of a chatbot, oldest first, a page at a time, with everything stored about each.
      operationId: list_contacts_chat__bot_id__contacts_get
      parameters:
      - in: path
        name: bot_id
        required: true
        schema:
          title: Bot Id
          type: string
      - in: query
        name: offset
        required: false
        schema:
          minimum: 0
          title: Offset
          type: integer
      - in: query
        name: limit
        required: false
        schema:
          maximum: 500
          minimum: 1
          title: Limit
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseData'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: List Contacts
      tags:
      - Contacts
  /chat/{bot_id}/contacts/{contact_id}:
    delete:
      description: 'Deletes a contact of a chatbot. It cannot be undone. If the same person writes again, it is
        stored

        again as a new contact.'
      operationId: delete_contact_chat__bot_id__contacts__contact_id__delete
      parameters:
      - in: path
        name: bot_id
        required: true
        schema:
          title: Bot Id
          type: string
      - in: path
        name: contact_id
        required: true
        schema:
          title: Contact Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseData'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Delete Contact
      tags:
      - Contacts
    get:
      description: 'Everything the service stores about a contact. It does not keep the messages: those go to the
        queue.'
      operationId: export_contact_chat__bot_id__contacts__contact_id__get
      parameters:
      - in: path
        name: bot_id
        required: true
        schema:
          title: Bot Id
          type: string
      - in: path
        name: contact_id
        required: true
        schema:
          title: Contact Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseData'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Export Contact
      tags:
      - Contacts
  /chat/{bot_id}/credentials:
    put:
      description: 'Loads or rotates the Meta credentials of a chatbot: the page token, the WhatsApp token and the
        App

        Secret. The ones sent replace the stored ones. The answer says which are loaded, never their values.'
      operationId: set_chatbot_credentials_chat__bot_id__credentials_put
      parameters:
      - in: path
        name: bot_id
        required: true
        schema:
          title: Bot Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BotCredentialsRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseData'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Set Chatbot Credentials
      tags:
      - Chat
  /chat/{bot_id}/info:
    get:
      operationId: get_chatbot_info_chat__bot_id__info_get
      parameters:
      - in: path
        name: bot_id
        required: true
        schema:
          title: Bot Id
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Get Chatbot Info
      tags:
      - Chat
  /chat/{bot_id}/intents:
    get:
      operationId: list_chatbot_intents_chat__bot_id__intents_get
      parameters:
      - in: path
        name: bot_id
        required: true
        schema:
          title: Bot Id
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: List Chatbot Intents
      tags:
      - Intents
    post:
      operationId: add_chatbot_intent_chat__bot_id__intents_post
      parameters:
      - in: path
        name: bot_id
        required: true
        schema:
          title: Bot Id
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntentRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Add Chatbot Intent
      tags:
      - Intents
  /chat/{bot_id}/intents/{intent_id}:
    delete:
      operationId: delete_chatbot_intent_chat__bot_id__intents__intent_id__delete
      parameters:
      - in: path
        name: bot_id
        required: true
        schema:
          title: Bot Id
      - in: path
        name: intent_id
        required: true
        schema:
          title: Intent Id
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Delete Chatbot Intent
      tags:
      - Intents
    get:
      operationId: get_chatbot_intent_chat__bot_id__intents__intent_id__get
      parameters:
      - in: path
        name: bot_id
        required: true
        schema:
          title: Bot Id
      - in: path
        name: intent_id
        required: true
        schema:
          title: Intent Id
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Get Chatbot Intent
      tags:
      - Intents
    put:
      operationId: update_chatbot_intent_chat__bot_id__intents__intent_id__put
      parameters:
      - in: path
        name: bot_id
        required: true
        schema:
          title: Bot Id
      - in: path
        name: intent_id
        required: true
        schema:
          title: Intent Id
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntentRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Update Chatbot Intent
      tags:
      - Intents
  /chat/{bot_id}/phones:
    get:
      operationId: get_chatbot_phones_chat__bot_id__phones_get
      parameters:
      - in: path
        name: bot_id
        required: true
        schema:
          title: Bot Id
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Get Chatbot Phones
      tags:
      - Chat
    post:
      operationId: add_whatsapp_phone_chat__bot_id__phones_post
      parameters:
      - in: path
        name: bot_id
        required: true
        schema:
          title: Bot Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatbotPhoneRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
