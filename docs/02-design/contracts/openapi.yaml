  /chat/{bot_id}/rules:
    get:
      operationId: get_chatbot_rules_chat__bot_id__rules_get
      parameters:
      - in: path
        name: bot_id
        required: true
        schema:
          title: Bot Id
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
