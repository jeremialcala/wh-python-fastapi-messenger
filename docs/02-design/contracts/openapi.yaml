      operationId: list_clients_clients_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseData'
          description: Successful Response
      security:
      - HTTPBearer: []
      summary: List Clients
      tags:
      - Clients
    post:
      description: 'The operator registers a client with its first public key. The answer carries what the client
        needs to

        call the service: its identifier, the audience and the gateway''s public keys.'
      operationId: register_client_clients_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseData'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
