  /chat/{bot_id}/tokens:
    get:
      description: 'The Meta tokens of a chatbot, for the response engine to send its answers with. Only the engine
        gets

        them, with the key it holds for the client that owns the chatbot, and every time it does is logged.'
      operationId: get_chatbot_tokens_chat__bot_id__tokens_get
      parameters:
      - in: path
        name: bot_id
        required: true
        schema:
          title: Bot Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseData'
          description: Successful Response
        '422':
