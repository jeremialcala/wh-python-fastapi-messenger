  /clients/{client_id}:
    delete:
      description: 'The operator takes a client off the service: its keys stop working at once, and its chatbots,
        with

        everything stored for them, and its data key are deleted. It cannot be undone.'
      operationId: delete_client_clients__client_id__delete
      parameters:
      - in: path
        name: client_id
        required: true
