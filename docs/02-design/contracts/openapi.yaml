      parameters:
      - in: path
        name: bot_id
        required: true
        schema:
          title: Bot Id
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Get Chatbot Tools
      tags:
      - Intents
  /clients:
