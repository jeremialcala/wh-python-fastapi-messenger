info:
  contact:
    email: jeremialcala@gmail.com
    name: Jeremi Alcala
    url: https://jeremi.web-ones.com/
  description: "\nThis is a Webhook for Facebook Messenger chatbot, \nthis application manages the chatbot lifecycle\
    \ for messenger and creates events \nto respond to and from Facebook. \n\n### BOT \n\n* /bot: This endpoint\
    \ controls the chatbot lifecycle, will have the fallowing operations:\n    * @POST: Create a new chatbot requiring\
    \ simple data and returning and UUID\n    * @GET: Will obtain the chatbot information using the param _id={BOT-ID}\n\
    \    \n* /chat: This webhook controls the chat lifecycle for an specific bot, will have the following operations:\n\
    \    * @GET: using the param bot_id={BOT-ID} (required) will do Facebook token verification challenge\n    *\
    \ @POST: using the param bot_id={BOT-ID} (required) will process a message send from Facebook to be processed\
    \ by this instance\n\n* /chat/{BOT-ID}/phones: This operation manage the Whatsapp Phone Numbers\n    * @POST:\
    \ Add a whatsapp phone number to your bot.\n    * @GET: This operation Obtains all Phones associated to this\
    \ bot. With the param ?phone.id={phone_id} will give you a specific number.  \n\n* /answers: This webhook will\
    \ send the process answer to the chat client using the facebook graph api.\n    * @POST: Will send the content\
    \ of this answer to final user conversation.\n"
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  summary: Controls the Facebook Messenger Lifecycle
  termsOfService: https://web-ones.com/terms
  title: Facebook Messenger Webhook Manager
  version: 0.0.0
openapi: 3.1.0
