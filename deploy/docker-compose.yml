# The gateway as it runs on the server, deployed by the webhook receiver
# (github.com/higerotech/despliegue-continuo). Copy to /srv/apps/bots-gateway/.
#
#   * the image tag is never `latest`: the receiver injects IMAGE_TAG with the commit sha,
#     so a rollback is just bringing the previous tag back up
#   * settings come from .env next to this file (same keys as config.env.example)
#   * the gateway's key pair is a file next to this one, readable only by uid 10001 and mounted read-only:
#     the service does not start without it (docs/03-implementation/autenticacion.md)
#   * the register of erasures is a directory next to this file, writable by uid 10001. It has to be in the
#     backups of the server: it is what says which deletions to make again after the database is restored
#     (docs/03-implementation/exportar-y-borrar.md)
#   * loopback only: whoever publishes it is a tunnel, and it must publish /chat/<uuid> and nothing else
#   * RabbitMQ is not here: it is reached over the external `hermod` network, as host `hermod`
#   * the key service is not here either: it is reached over the external `andvari` network, as host
#     `andvari`, with its CA and the gateway's AppRole secret id mounted read-only

name: bots-gateway

services:
  gateway:
    image: ghcr.io/jeremialcala/wh-python-fastapi-messenger:${IMAGE_TAG:?IMAGE_TAG is required}
    container_name: bots-gateway
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Two cores on the host, and they also route the network.
      WEB_CONCURRENCY: 2
      GATEWAY_KEYS_FILE: /run/gateway/gateway-keys.json
      ANDVARI_ADDR: https://andvari:8200
      ANDVARI_CA_FILE: /run/gateway/andvari-ca.crt
      ANDVARI_SECRET_ID_FILE: /run/gateway/andvari-secret-id
      ERASURES_DIR: /var/lib/gateway/erasures
    volumes:
      - ./keys/gateway-keys.json:/run/gateway/gateway-keys.json:ro
      - ./keys/andvari-secret-id:/run/gateway/andvari-secret-id:ro
      - /srv/infra/andvari/tls/ca.crt:/run/gateway/andvari-ca.crt:ro
      - ./erasures:/var/lib/gateway/erasures
    ports:
      - "127.0.0.1:5002:5002"
    networks: [hermod, andvari]
    mem_limit: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

networks:
  hermod:
    external: true
  andvari:
    external: true
