# A NATS JetStream for the integration tests, set up like Bifröst (the bus in production, repository bifrost):
# fsync before each acknowledgement, the same largest message, and the webhook's user with only its own subjects
# and its own prefix of reply subjects. No TLS and no encrypted store: those are the server's, not the client's.
#
#   docker run --rm -p 127.0.0.1:24222:4222 -p 127.0.0.1:28222:8222 -v "$PWD/tests/integration/nats-test.conf:/etc/nats/test.conf:ro" \
#       nats:2.14.8-alpine -c /etc/nats/test.conf

listen: 0.0.0.0:4222
http: 0.0.0.0:8222
max_payload: 4MB

jetstream {
  store_dir: "/tmp/jetstream"
  sync_interval: always
}

authorization {
  users: [
    # The tests set the streams up and look at them with this one.
    { user: admin, password: test }
    # What Bifröst gives the webhook.
    { user: webhook, password: test, permissions: {
        publish: { allow: ["webhook.meta.>"] }
        subscribe: { allow: ["_INBOX_webhook.>"] }
    } }
  ]
}
