version: 1
disable_existing_loggers: False

formatters:
    simple:
        format: '[%(asctime)s.%(msecs)03d] %(levelname)-7s [%(name)-7s] %(funcName)-30s %(message)s'
        datefmt: '%Y-%m-%d %H:%M:%S'

handlers:
    console:
        class: logging.StreamHandler
        level: INFO
        formatter: simple
        stream: ext://sys.stdout

    file:
        class: logging.FileHandler
        level: INFO
        formatter: simple
        filename: application.log
        mode: a
        # Opened on first use, so an environment that never logs to the file does not need a writable directory.
        delay: true

loggers:
    development:
        level: INFO
        handlers: [console]
        propagate: no

    staging:
        level: INFO
        handlers: [console, file]
        propagate: no

    # Production runs in a container: stdout is what `docker logs` keeps and rotates.
    production:
        level: WARNING
        handlers: [console]
        propagate: no

    # What other libraries would write of each request. None of it may reach an output, at any level:
    # the server's access log writes the address with its query string, where Meta sends the verification
    # token; the database driver writes each query, with what it searches for; and the HTTP client writes the
    # address it calls, which for the Graph API carries the page token.
    uvicorn.access:
        level: WARNING
    pymongo:
        level: WARNING
    urllib3:
        level: WARNING
    # The RabbitMQ client writes every connection it opens and closes, with its parameters: 18 lines for each
    # message the ingestion worker hands to Hermod (measured on midgard), that say nothing went wrong.
    pika:
        level: WARNING

root:
    level: DEBUG
    handlers: [console]